<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Poseable Ouroboros — Offline</title>
<style>
  :root { color-scheme: dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#0b0c10; }
  body { touch-action:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #top {
    position:fixed; z-index:5;
    top:calc(8px + env(safe-area-inset-top));
    left:max(8px,env(safe-area-inset-left));
    right:max(8px,env(safe-area-inset-right));
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    background:rgba(18,19,24,.86);
    backdrop-filter:blur(12px);
  }
  #title { font-size:16px; font-weight:700; }
  #help { margin-top:3px; font-size:12px; line-height:1.25; opacity:.8; }
  #depthRow {
    display:grid; grid-template-columns:auto 1fr 48px;
    gap:8px; align-items:center; margin-top:8px; font-size:12px;
  }
  input[type=range]{ width:100%; }
  #bottom {
    position:fixed; z-index:5;
    left:max(8px,env(safe-area-inset-left));
    right:max(8px,env(safe-area-inset-right));
    bottom:calc(8px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(4,1fr); gap:7px;
  }
  button {
    min-height:44px; border:0; border-radius:12px;
    background:#ececef; color:#111; font-weight:700;
    font-size:13px; padding:8px 5px;
  }
  button.active { background:#92d3ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="title">Poseable Ouroboros — offline</div>
  <div id="help">
    Edit: drag white points. Select a point and use Depth to move that section behind/in front of Earth.
    Orbit: drag to rotate the scene; pinch to zoom.
  </div>
  <div id="depthRow">
    <span>Depth</span>
    <input id="depth" type="range" min="-4" max="4" step=".05" value="0">
    <span id="dv">—</span>
  </div>
</div>

<div id="bottom">
  <button id="edit" class="active">Edit</button>
  <button id="orbit">Orbit</button>
  <button id="add">Add point</button>
  <button id="del">Delete</button>
  <button id="ghost">Earth solid</button>
  <button id="pts">Points on</button>
  <button id="reset">Reset</button>
  <button id="shot">Snapshot</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const depth = document.getElementById('depth');
  const dv = document.getElementById('dv');

  let dpr = Math.min(devicePixelRatio || 1, 2);
  let W=0,H=0, scale=1, cx=0, cy=0;

  const earth = {x:-.45,y:-.25,z:0,r:2.15,alpha:1};
  let yaw = -0.05, pitch = 0.08, zoom = 1;
  let mode='edit', showPoints=true;
  let selected=-1, dragging=false;
  let lastX=0,lastY=0;
  let pinchStart=0, zoomStart=1;

  const initial = [
    [-1.45, 2.20,  0.90],  // head
    [-2.20, 1.70,  0.60],
    [-3.10, 0.85,  0.10],
    [-3.40,-0.40,  0.50],
    [-2.90,-1.75,  1.15],
    [-1.65,-2.55,  2.05],
    [-0.05,-2.75,  2.55],
    [ 1.45,-2.45,  2.10],
    [ 2.45,-1.55,  1.30],
    [ 2.70,-0.15,  0.15],
    [ 2.15, 1.10, -1.15],
    [ 1.05, 1.80, -1.90],
    [ 0.05, 2.05, -1.35]   // tail near head
  ];
  let pts = initial.map(p=>p.slice());

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    scale=Math.min(W,H)*0.105*zoom;
    cx=W*0.46; cy=H*0.52;
    draw();
  }

  function rot(p){
    let [x,y,z]=p;
    let cyw=Math.cos(yaw), syw=Math.sin(yaw);
    let x1=x*cyw-z*syw, z1=x*syw+z*cyw;
    let cp=Math.cos(pitch), sp=Math.sin(pitch);
    let y1=y*cp-z1*sp, z2=y*sp+z1*cp;
    return [x1,y1,z2];
  }
  function proj(p){
    const [x,y,z]=rot(p);
    const persp = 1/(1+z*0.045);
    return {x:cx+x*scale*persp, y:cy-y*scale*persp, z, persp};
  }
  function earthScreen(){
    const p=proj([earth.x,earth.y,earth.z]);
    return {...p, r:earth.r*scale*p.persp};
  }

  function catmull(a,b,c,d,t){
    const t2=t*t,t3=t2*t;
    return [
      .5*((2*b[0])+(-a[0]+c[0])*t+(2*a[0]-5*b[0]+4*c[0]-d[0])*t2+(-a[0]+3*b[0]-3*c[0]+d[0])*t3),
      .5*((2*b[1])+(-a[1]+c[1])*t+(2*a[1]-5*b[1]+4*c[1]-d[1])*t2+(-a[1]+3*b[1]-3*c[1]+d[1])*t3),
      .5*((2*b[2])+(-a[2]+c[2])*t+(2*a[2]-5*b[2]+4*c[2]-d[2])*t2+(-a[2]+3*b[2]-3*c[2]+d[2])*t3)
    ];
  }
  function sampleCurve(){
    const out=[];
    for(let i=0;i<pts.length-1;i++){
      const a=pts[Math.max(0,i-1)], b=pts[i], c=pts[i+1], d=pts[Math.min(pts.length-1,i+2)];
      const n=14;
      for(let s=0;s<n;s++){
        const t=s/n;
        out.push(catmull(a,b,c,d,t));
      }
    }
    out.push(pts[pts.length-1].slice());
    return out;
  }

  function depthVisibility(p){
    // Approximate Earth occlusion using projected point-in-circle + camera depth.
    const sp=proj(p), es=earthScreen();
    const dx=sp.x-es.x, dy=sp.y-es.y;
    const inside = dx*dx+dy*dy < es.r*es.r;
    const er=rot([earth.x,earth.y,earth.z]);
    // Larger z is farther away in this projection.
    const behind = sp.z > er[2];
    return !(inside && behind && earth.alpha>.5);
  }

  function drawSnake(samples, visiblePass){
    ctx.lineCap='round'; ctx.lineJoin='round';
    const base=0.36*scale;

    let last=null, lastVis=null;
    for(let i=0;i<samples.length;i++){
      const p=samples[i], s=proj(p);
      const vis=depthVisibility(p);
      if(last && vis===visiblePass && lastVis===visiblePass){
        const width = base * s.persp * (0.98 - 0.48*(i/(samples.length-1))**5);
        ctx.strokeStyle = visiblePass ? '#8ea66c' : 'rgba(82,96,66,.36)';
        ctx.lineWidth=width;
        ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(s.x,s.y); ctx.stroke();

        ctx.strokeStyle = visiblePass ? 'rgba(35,45,28,.45)' : 'rgba(20,25,18,.18)';
        ctx.lineWidth=Math.max(1,width*.08);
        ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(s.x,s.y); ctx.stroke();
      }
      last=s; lastVis=vis;
    }
  }

  function drawEarth(){
    const e=earthScreen();
    const g=ctx.createRadialGradient(e.x-e.r*.35,e.y-e.r*.4,e.r*.1,e.x,e.y,e.r);
    g.addColorStop(0,`rgba(132,170,205,${earth.alpha})`);
    g.addColorStop(.62,`rgba(77,119,158,${earth.alpha})`);
    g.addColorStop(1,`rgba(28,50,75,${earth.alpha})`);
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(210,225,240,${.55*earth.alpha})`;
    ctx.lineWidth=2; ctx.stroke();

    // Simple continent blobs purely for orientation.
    ctx.fillStyle=`rgba(125,151,83,${.82*earth.alpha})`;
    const blobs=[[-.55,-.5,.55,.32],[.3,-.2,.65,.38],[-.1,.55,.48,.25]];
    for(const [bx,by,rx,ry] of blobs){
      ctx.beginPath();
      ctx.ellipse(e.x+bx*e.r,e.y+by*e.r,rx*e.r,ry*e.r,.25,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawHead(){
    const p=proj(pts[0]), p2=proj(pts[1]);
    const ang=Math.atan2(p.y-p2.y,p.x-p2.x);
    ctx.save();
    ctx.translate(p.x,p.y);ctx.rotate(ang);
    ctx.fillStyle='#9dad78';
    ctx.strokeStyle='#263020';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,0.58*scale*p.persp,0.38*scale*p.persp,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(.12*scale*p.persp,-.12*scale*p.persp,.045*scale*p.persp,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function drawTail(){
    const n=pts.length, p=proj(pts[n-1]), q=proj(pts[n-2]);
    const dx=p.x-q.x,dy=p.y-q.y, L=Math.hypot(dx,dy)||1, ux=dx/L,uy=dy/L, nx=-uy,ny=ux;
    const w=.28*scale*p.persp;
    ctx.fillStyle='#8ea66c';ctx.strokeStyle='#263020';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p.x+ux*w*1.4,p.y+uy*w*1.4);
    ctx.lineTo(p.x-ux*w*.6+nx*w,p.y-uy*w*.6+ny*w);
    ctx.lineTo(p.x-ux*w*.6-nx*w,p.y-uy*w*.6-ny*w);
    ctx.closePath();ctx.fill();ctx.stroke();
  }

  function drawPoints(){
    if(!showPoints)return;
    pts.forEach((p,i)=>{
      const s=proj(p);
      ctx.fillStyle=i===selected?'#ffd166':'#fff';
      ctx.strokeStyle='#111';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(s.x,s.y,i===selected?9:7,0,Math.PI*2);ctx.fill();ctx.stroke();
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // stars
    ctx.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<90;i++){
      const x=(i*137.5)%W, y=(i*83.3)%H;
      ctx.fillRect(x,y,1.2,1.2);
    }

    const samples=sampleCurve();
    // Hidden snake first, then Earth, then visible snake.
    drawSnake(samples,false);
    drawEarth();
    drawSnake(samples,true);
    drawHead();
    drawTail();
    drawPoints();
  }

  function nearestPoint(x,y){
    let best=-1,bd=1e9;
    pts.forEach((p,i)=>{
      const s=proj(p), d=(s.x-x)**2+(s.y-y)**2;
      if(d<bd){bd=d;best=i;}
    });
    return bd<32*32?best:-1;
  }

  function screenDeltaToWorld(dx,dy){
    return [dx/scale,-dy/scale];
  }

  function ptXY(e){
    if(e.touches && e.touches[0]) return [e.touches[0].clientX,e.touches[0].clientY];
    return [e.clientX,e.clientY];
  }

  function down(e){
    if(e.touches && e.touches.length===2){
      pinchStart=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
      zoomStart=zoom; return;
    }
    const [x,y]=ptXY(e); lastX=x;lastY=y;
    if(mode==='edit'){
      const n=nearestPoint(x,y);
      if(n>=0){ selected=n; dragging=true; syncDepth(); draw(); }
    } else dragging=true;
    e.preventDefault();
  }

  function move(e){
    if(e.touches && e.touches.length===2 && pinchStart){
      const d=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY
      );
      zoom=Math.max(.55,Math.min(2.2,zoomStart*d/pinchStart));
      scale=Math.min(W,H)*0.105*zoom; draw(); e.preventDefault(); return;
    }
    if(!dragging)return;
    const [x,y]=ptXY(e), dx=x-lastX,dy=y-lastY; lastX=x;lastY=y;
    if(mode==='edit' && selected>=0){
      const [wx,wy]=screenDeltaToWorld(dx,dy);
      pts[selected][0]+=wx; pts[selected][1]+=wy;
    } else if(mode==='orbit'){
      yaw += dx*0.008; pitch += dy*0.008;
      pitch=Math.max(-1.2,Math.min(1.2,pitch));
    }
    draw();e.preventDefault();
  }
  function up(){dragging=false;pinchStart=0;}

  canvas.addEventListener('touchstart',down,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',up,{passive:false});
  canvas.addEventListener('pointerdown',down,{passive:false});
  canvas.addEventListener('pointermove',move,{passive:false});
  canvas.addEventListener('pointerup',up);

  function syncDepth(){
    if(selected<0){depth.disabled=true;dv.textContent='—';}
    else{depth.disabled=false;depth.value=pts[selected][2];dv.textContent=pts[selected][2].toFixed(2);}
  }
  depth.addEventListener('input',()=>{
    if(selected<0)return;
    pts[selected][2]=+depth.value;dv.textContent=(+depth.value).toFixed(2);draw();
  });

  function setMode(m){
    mode=m;
    document.getElementById('edit').classList.toggle('active',m==='edit');
    document.getElementById('orbit').classList.toggle('active',m==='orbit');
  }
  document.getElementById('edit').onclick=()=>setMode('edit');
  document.getElementById('orbit').onclick=()=>setMode('orbit');

  document.getElementById('ghost').onclick=()=>{
    earth.alpha=earth.alpha>.5?.22:1;
    document.getElementById('ghost').textContent=earth.alpha>.5?'Earth solid':'Earth ghost';
    draw();
  };
  document.getElementById('pts').onclick=()=>{
    showPoints=!showPoints;
    document.getElementById('pts').textContent=showPoints?'Points on':'Points off';
    draw();
  };
  document.getElementById('reset').onclick=()=>{
    pts=initial.map(p=>p.slice()); selected=-1; yaw=-.05;pitch=.08;zoom=1;
    scale=Math.min(W,H)*.105*zoom; syncDepth();draw();
  };
  document.getElementById('add').onclick=()=>{
    if(selected<0) selected=Math.max(0,pts.length-2);
    const i=Math.min(selected+1,pts.length-1);
    const a=pts[i-1],b=pts[i];
    pts.splice(i,0,[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]);
    selected=i;syncDepth();draw();
  };
  document.getElementById('del').onclick=()=>{
    if(selected<0||pts.length<=6)return;
    pts.splice(selected,1); selected=Math.min(selected,pts.length-1);syncDepth();draw();
  };
  document.getElementById('shot').onclick=()=>{
    const old=showPoints;showPoints=false;draw();
    const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='ouroboros-pose.png';
    document.body.appendChild(a);a.click();a.remove();showPoints=old;draw();
  };

  addEventListener('resize',resize);
  syncDepth(); resize();
})();
</script>
</body>
</html>

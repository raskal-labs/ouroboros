<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
OUROBOROS POSE EDITOR — WORKING SPEC (v9.1 modular baseline)

Dependency-free, touch-first browser app. This branch preserves v9.1 behavior while splitting
source into static HTML, CSS, and JavaScript so the v1.0.0 work can proceed safely. GitHub Pages
remains the canonical browser runtime and no package manager or build step is required.

Preserve the continuous Catmull-Rom snake, point-zero HEAD / last-point TAIL semantics,
TAIL→HEAD arrows, Edit/Move/Pan separation, viewport-only pan/zoom, endpoint controls,
diagnostics, snapshots, JSON import/export, collapsible mobile UI, and iOS compatibility.

Scene depth is 0..14 with 6.5 as the normal reference and larger values closer to viewer.
Perspective Strength affects apparent illustration scale/thickness independently of viewport
zoom. Earth has x/y/depth/scale/lock state; Moon is Earth-relative and follows Earth.
Snake control points carry x/y/depth/manual-width/Earth-topology/contact metadata.
Explicit Earth and self-crossing topology overrides always beat automatic classification.

Input model:
- Tap/left-click a control point to select it; drag it in Edit mode to pose it.
- Move mode moves only the snake. Pan mode moves only the viewport.
- When Earth is unlocked, dragging Earth in Edit mode moves Earth (and therefore Moon).
- Long-press a snake segment to insert a control point at that curve location.
- Long-press a control point opens point actions; right-click opens the same contextual menu.
- Double-click a snake segment inserts a point. Existing Add/Delete buttons remain available.
- Two-finger pinch and two-finger translation zoom/pan the viewport simultaneously.
- Mouse wheel/trackpad zooms around the pointer; Shift+wheel pans; middle-drag or Space+drag pans.
- Keyboard: E/M/P modes, arrow keys nudge the selected point (Shift = larger step), Cmd/Ctrl+Z undo,
  Cmd/Ctrl+Shift+Z redo, Delete/Backspace deletes an eligible point, +/- zooms, Escape closes transient UI.

Undo/redo stores compact meaningful scene snapshots (limit 50). Autosave uses localStorage and
restores on reload. JSON schema is version 9. Version-4 signed-depth JSON is migrated with
z -> clamp(z + 6.5, 0, 14); version-7 and version-8 state are accepted. v9 exports head and tail
settings separately while continuing to import the older combined endpoint object.

v9.1 uses connected variable-width outline and body ribbons so the snake edge remains smooth
without visible circular sample caps. Length Lock and pixel-art post-processing remain removed.
-->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ouroboros Pose Editor v9.1</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/ui-shell.css">
</head>
<body>
<canvas id="canvas"></canvas>
<div id="topbar"><div id="modeGroup"><button id="editMode" class="active">Edit</button><button id="moveMode">Move</button><button id="panMode">Pan</button></div><button id="undoBtn" class="miniTop" title="Undo">↶</button><button id="redoBtn" class="miniTop" title="Redo">↷</button><div id="selectionLabel">NONE</div><button id="menuBtn">⋯</button></div>
<button id="restoreUI">☰</button>
<div id="menu">
<button id="snapshot">Snapshot</button><button id="cleanSnapshot">Clean Snapshot</button><button id="diagSnapshot">Diagnostic Snapshot</button><button id="export">Export JSON</button><button id="import">Import JSON</button><button id="checkpointMenu">Checkpoints</button><button id="saveCheckpoint">Save checkpoint</button><button id="gestureHelp">Controls & gestures</button><button id="openPose">Open head</button><button id="resetView">Reset view</button><button id="reset">Reset pose</button><button id="hideUI">Hide UI</button>
</div>

<div id="contextMenu">
<button id="contextAdd">Add point here</button>
<button id="contextDuplicate">Duplicate point</button>
<button id="contextDelete">Delete point</button>
<button id="contextEarthRelation">Earth: AUTO</button>
<button id="contextContact">Contact: AUTO</button>
<button id="contextEarthLock">Unlock Earth</button>
</div>

<div id="sheet"><div id="sheetHandle"><div id="handleChevron">︿</div><div id="handleTitle">Controls</div><div id="handleDepth">—</div></div><div id="sheetBody">
<div class="sectionTitle">Selected point</div>
<div class="controlRow"><label>X</label><input id="pointX" type="range" min="-25" max="25" step=".01" value="0"><div class="controlValue" id="pointXValue">—</div></div>
<div class="controlRow"><label>Y</label><input id="pointY" type="range" min="-25" max="25" step=".01" value="0"><div class="controlValue" id="pointYValue">—</div></div>
<div class="controlRow"><label>Depth</label><input id="depth" type="range" min="0" max="14" step=".05" value="6.5"><div class="controlValue" id="depthValue">—</div></div>
<div class="triButtons"><button id="farBtn">FAR 3</button><button id="centreBtn">NORMAL 6.5</button><button id="nearBtn">NEAR 10</button></div>
<div class="controlRow"><label>Width</label><input id="pointWidth" type="range" min=".35" max="2.5" step=".05" value="1"><div class="controlValue" id="pointWidthValue">—</div></div>
<div class="controlRow"><label>Earth relation</label><select id="earthRelation"><option value="AUTO">AUTO</option><option value="FRONT_OF_EARTH">FRONT</option><option value="BEHIND_EARTH">BEHIND</option></select><div class="controlValue">override</div></div>
<div class="controlRow"><label>Contact</label><select id="contactState"><option value="AUTO">AUTO</option><option value="FREE">FREE</option><option value="TOUCHING_EARTH">TOUCHING</option></select><div class="controlValue">state</div></div>

<div class="section"><div class="sectionTitle">Snake</div>
<div class="controlRow"><label>Snake scale</label><input id="snakeScale" type="range" min=".5" max="2" step=".01" value="1"><div class="controlValue" id="scaleValue">1.00×</div></div>
<div class="controlRow"><label>View zoom</label><input id="viewZoom" type="range" min=".35" max="4" step=".05" value="1"><div class="controlValue" id="viewZoomValue">1.00×</div></div>
<div class="controlRow"><label>Perspective</label><input id="perspective" type="range" min="0" max="2.4" step=".05" value="1"><div class="controlValue" id="perspectiveValue">1.00×</div></div>
<div class="controlRow readOnlyRow"><label>Arc length</label><div class="readOnlyValue" id="arcLengthValue">—</div></div>
<div class="controlRow"><label>Outline</label><input id="outlineThickness" type="range" min="0" max=".35" step=".01" value=".08"><div class="controlValue" id="outlineValue">0.08</div></div>
<div class="twoCol"><button id="outlineToggle" class="active">Outline</button><button id="add">Add point</button></div><button id="del" style="width:100%">Delete point</button>
</div>

<div id="endpointControls" class="section hidden"><div id="endpointTitle" class="sectionTitle">Endpoint</div>
<div id="headControls" class="hidden">
<div class="controlRow"><label>Head size</label><input id="headSize" type="range" min=".5" max="2" step=".05" value="1"><div class="controlValue" id="headSizeValue">1.00×</div></div>
<div class="controlRow"><label>Head rotate</label><input id="headRotation" type="range" min="-180" max="180" step="1" value="0"><div class="controlValue" id="headRotationValue">0°</div></div>
<div class="controlRow"><label>Neck width</label><input id="neckWidth" type="range" min=".45" max="1.6" step=".05" value="1"><div class="controlValue" id="neckWidthValue">1.00×</div></div>
<div class="controlRow"><label>Eye open</label><input id="eyeOpen" type="range" min="0" max="1" step=".05" value=".35"><div class="controlValue" id="eyeOpenValue">0.35</div></div>
<div class="controlRow"><label>Eye X</label><input id="eyeX" type="range" min="-.5" max=".7" step=".05" value=".22"><div class="controlValue" id="eyeXValue">0.22</div></div>
<div class="controlRow"><label>Eye Y</label><input id="eyeY" type="range" min="-.6" max=".6" step=".05" value="-.18"><div class="controlValue" id="eyeYValue">-0.18</div></div>
<div class="controlRow"><label>Gaze</label><input id="gazeDirection" type="range" min="-180" max="180" step="1" value="-70"><div class="controlValue" id="gazeDirectionValue">-70°</div></div>
<div class="controlRow"><label>Mouth open</label><input id="mouthOpen" type="range" min="0" max="1" step=".05" value=".18"><div class="controlValue" id="mouthOpenValue">0.18</div></div>
</div>
<div id="tailControls" class="hidden">
<div class="controlRow"><label>Tail length</label><input id="tailLength" type="range" min=".4" max="2.5" step=".05" value="1"><div class="controlValue" id="tailLengthValue">1.00×</div></div>
<div class="controlRow"><label>Tail width</label><input id="tailWidth" type="range" min=".3" max="1.8" step=".05" value="1"><div class="controlValue" id="tailWidthValue">1.00×</div></div>
<div class="controlRow"><label>Tail direction</label><input id="tailDirection" type="range" min="-120" max="120" step="1" value="0"><div class="controlValue" id="tailDirectionValue">0°</div></div>
<div class="controlRow"><label>Tail curve</label><input id="tailCurvature" type="range" min="-1" max="1" step=".05" value="0"><div class="controlValue" id="tailCurvatureValue">0.00</div></div>
</div></div>

<div class="section"><div class="sectionTitle">Earth and Moon</div>
<div class="controlRow"><label>Earth X</label><input id="earthX" type="range" min="-5" max="5" step=".05" value="0"><div class="controlValue" id="earthXValue">0.00</div></div>
<div class="controlRow"><label>Earth Y</label><input id="earthY" type="range" min="-5" max="5" step=".05" value="0"><div class="controlValue" id="earthYValue">0.00</div></div>
<div class="controlRow"><label>Earth depth</label><input id="earthDepth" type="range" min="0" max="14" step=".05" value="6.5"><div class="controlValue" id="earthDepthValue">6.5</div></div>
<div class="controlRow"><label>Earth scale</label><input id="earthScale" type="range" min=".4" max="2" step=".02" value="1"><div class="controlValue" id="earthScaleValue">1.00×</div></div>
<div class="twoCol"><button id="earthLock" class="active">Earth locked</button><button id="moonVisible" class="active">Moon visible</button></div>
<div class="controlRow"><label>Moon angle</label><input id="moonAngle" type="range" min="0" max="360" step="1" value="35"><div class="controlValue" id="moonAngleValue">35°</div></div>
<div class="controlRow"><label>Moon orbit</label><input id="moonRadius" type="range" min="1.2" max="5" step=".05" value="3"><div class="controlValue" id="moonRadiusValue">3.00</div></div>
<div class="controlRow"><label>Moon size</label><input id="moonSize" type="range" min=".05" max=".5" step=".01" value=".27"><div class="controlValue" id="moonSizeValue">0.27</div></div>
<div class="controlRow"><label>Moon Δdepth</label><input id="moonDepth" type="range" min="-7" max="7" step=".05" value="1"><div class="controlValue" id="moonDepthValue">+1.0</div></div>
</div>

<div class="section"><div class="sectionTitle">Topology</div><div class="subtle" id="crossingInfo">Crossings: 0</div>
<div class="twoCol"><button id="cycleCrossing">Cycle crossing</button><button id="flipCrossing">Flip front</button></div>
<div class="twoCol"><button id="transitionToggle" class="active">Transitions</button><button id="contactToggle" class="active">Contacts</button></div>
</div>

<div class="section"><div class="sectionTitle">Guides</div><div class="quadButtons"><button id="referenceCircle">Circle</button><button id="mouthTailGuide">Mouth↔tail</button><button id="closurePreview">Closure</button><button id="gazeArrow" class="active">Gaze</button></div></div>

<div class="section"><div class="sectionTitle">Lighting</div><div class="twoCol"><button id="lightToggle" class="active">Light</button><button id="shadowToggle" class="active">Shadows</button></div>
<div class="controlRow"><label>Direction</label><input id="lightDirection" type="range" min="-180" max="180" step="1" value="-45"><div class="controlValue" id="lightDirectionValue">-45°</div></div>
<div class="controlRow"><label>Intensity</label><input id="lightIntensity" type="range" min="0" max="1.5" step=".05" value=".65"><div class="controlValue" id="lightIntensityValue">0.65</div></div>
<div class="controlRow"><label>Softness</label><input id="lightSoftness" type="range" min="0" max="1" step=".05" value=".6"><div class="controlValue" id="lightSoftnessValue">0.60</div></div>
</div>

<div class="section"><div class="sectionTitle">Display</div><div class="quadButtons"><button id="arrows" class="active">Arrows</button><button id="points" class="active">Points</button><button id="labels" class="active">Labels</button><button id="xray" class="active">X-ray</button><button id="ghost">Ghost Earth</button><button id="cleanMode">Clean</button><button id="diagnosticMode" class="active">Diagnostic</button><button id="numbers" class="active">Numbers</button></div></div>
</div></div>

<div id="overlay"><div id="overlayCard"><div id="overlayTitle">Export</div><img id="snapshotImage" alt="Pose snapshot"><textarea id="jsonBox" spellcheck="false"></textarea><div id="checkpointBox"></div><div id="overlayButtons"><button id="copyOverlay">Copy</button><button id="applyImport">Apply</button><button id="closeOverlay">Close</button></div></div></div>

<script type="module" src="./js/app.js"></script>
<script type="module" src="./js/ui-shell.js"></script>
</body>
</html>

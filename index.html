<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Poseable Ouroboros Reference</title>
<style>
  :root {
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #toolbar {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 8px;
    z-index: 10;
  }
  button, input {
    font: inherit;
  }
  button {
    min-height: 44px;
    border: 0;
    border-radius: 12px;
    padding: 8px 10px;
    background: rgba(245,245,245,.92);
    color: #111;
    font-weight: 600;
  }
  button.active {
    background: #9bd7ff;
  }
  #panel {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    z-index: 10;
    background: rgba(20,20,24,.82);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    padding: 10px 12px;
    max-width: 560px;
  }
  #title { font-weight: 700; margin-bottom: 4px; }
  #help {
    font-size: 13px;
    line-height: 1.3;
    opacity: .82;
  }
  #depthRow {
    margin-top: 8px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: center;
    font-size: 13px;
  }
  #depth { width: 100%; }
  #status {
    margin-top: 6px;
    font-size: 12px;
    opacity: .72;
  }
  @media (min-width: 700px) {
    #toolbar { left: 10px; right: auto; width: 520px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="panel">
  <div id="title">Poseable Ouroboros</div>
  <div id="help">
    <b>Edit:</b> drag the white control points. Use the depth slider to move the selected point in front of or behind Earth.
    <b>Orbit:</b> rotate the whole scene with one finger; pinch to zoom.
  </div>
  <div id="depthRow">
    <span>Depth</span>
    <input id="depth" type="range" min="-4.5" max="4.5" step="0.05" value="0">
    <span id="depthValue">0.00</span>
  </div>
  <div id="status">Tap a control point to select it.</div>
</div>

<div id="toolbar">
  <button id="editBtn" class="active">Edit</button>
  <button id="orbitBtn">Orbit</button>
  <button id="addBtn">Add point</button>
  <button id="deleteBtn">Delete</button>
  <button id="earthBtn">Earth solid</button>
  <button id="pointsBtn">Points on</button>
  <button id="resetBtn">Reset</button>
  <button id="shotBtn">Snapshot</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
(() => {
  const app = document.getElementById('app');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0c12);

  const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0.2, 2.2, 11.5);

  const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  app.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2.2));
  const key = new THREE.DirectionalLight(0xffffff, 2.3);
  key.position.set(5, 6, 8);
  scene.add(key);

  // Earth
  const earthMat = new THREE.MeshPhongMaterial({
    color: 0x6b8bb8,
    shininess: 12,
    transparent: true,
    opacity: 1
  });
  const earth = new THREE.Mesh(new THREE.SphereGeometry(2.25, 64, 40), earthMat);
  earth.position.set(-0.55, -0.25, 0);
  scene.add(earth);

  // Simple latitude/longitude wire overlay
  const wire = new THREE.Mesh(
    new THREE.SphereGeometry(2.265, 24, 16),
    new THREE.MeshBasicMaterial({ color:0xcad8ef, wireframe:true, transparent:true, opacity:.10 })
  );
  wire.position.copy(earth.position);
  scene.add(wire);

  // A few tiny stars for orientation
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i=0;i<350;i++) {
    const r = 22;
    const v = new THREE.Vector3(
      (Math.random()-.5)*r,
      (Math.random()-.5)*r,
      -8 - Math.random()*8
    );
    starPos.push(v.x,v.y,v.z);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:.035})));

  const snakeMat = new THREE.MeshPhongMaterial({
    color: 0x91a86f,
    shininess: 18
  });
  const headMat = new THREE.MeshPhongMaterial({ color: 0x9cad76, shininess: 18 });
  const controlMat = new THREE.MeshBasicMaterial({ color:0xffffff });
  const selectedMat = new THREE.MeshBasicMaterial({ color:0xffd166 });

  let initialPoints = [
    [-1.65,  2.35,  0.85],  // head
    [-2.55,  1.75,  0.25],
    [-3.55,  0.85, -0.20],
    [-3.75, -0.45,  0.55],
    [-3.15, -1.95,  1.25],
    [-1.85, -2.70,  2.15],
    [-0.15, -2.95,  2.65],
    [ 1.55, -2.55,  2.15],
    [ 2.60, -1.55,  1.25],
    [ 2.85, -0.10,  0.10],
    [ 2.35,  1.15, -1.15],
    [ 1.20,  1.95, -1.95],
    [-0.05,  2.15, -1.45]  // tail near head, behind
  ];

  let pts = [];
  let controlsMeshes = [];
  let snakeMesh = null;
  let headMesh = null;
  let tailMesh = null;
  let selected = null;
  let mode = 'edit';
  let showPoints = true;

  const orbit = new THREE.OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.target.set(-0.4, -0.2, 0);
  orbit.enabled = false;
  orbit.minDistance = 6;
  orbit.maxDistance = 22;

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const dragPlane = new THREE.Plane();
  const intersection = new THREE.Vector3();
  const cameraDir = new THREE.Vector3();
  let dragging = false;
  let dragIndex = -1;

  function makeControl(p, i) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(.13, 18, 14), controlMat.clone());
    m.position.copy(p);
    m.userData.index = i;
    scene.add(m);
    return m;
  }

  function rebuildControls() {
    controlsMeshes.forEach(m => scene.remove(m));
    controlsMeshes = pts.map((p,i) => makeControl(p,i));
    setPointsVisibility();
    updateSelectionVisual();
  }

  function setPointsVisibility() {
    controlsMeshes.forEach(m => m.visible = showPoints);
  }

  function rebuildSnake() {
    if (snakeMesh) scene.remove(snakeMesh);
    if (headMesh) scene.remove(headMesh);
    if (tailMesh) scene.remove(tailMesh);

    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.45);
    snakeMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 220, .34, 14, false), snakeMat);
    scene.add(snakeMesh);

    // Head = slightly elongated ellipsoid at first point
    headMesh = new THREE.Mesh(new THREE.SphereGeometry(.52, 28, 20), headMat);
    headMesh.scale.set(1.15, .85, .85);
    headMesh.position.copy(pts[0]);
    const headDir = pts[1].clone().sub(pts[0]).normalize();
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), headDir);
    headMesh.quaternion.copy(q);
    scene.add(headMesh);

    // Tail = cone attached at last point, aligned with final segment
    const tailDir = pts[pts.length-1].clone().sub(pts[pts.length-2]).normalize();
    tailMesh = new THREE.Mesh(new THREE.ConeGeometry(.34, 1.15, 18), snakeMat);
    tailMesh.position.copy(pts[pts.length-1]).addScaledVector(tailDir, .45);
    // Cone points +Y; rotate +Y to tail direction.
    tailMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tailDir);
    scene.add(tailMesh);
  }

  function updateAll() {
    controlsMeshes.forEach((m,i) => m.position.copy(pts[i]));
    rebuildSnake();
    updateDepthUI();
  }

  function reset() {
    pts = initialPoints.map(p => new THREE.Vector3(...p));
    selected = null;
    rebuildControls();
    rebuildSnake();
    updateDepthUI();
    document.getElementById('status').textContent = 'Reset. Tap a control point to select it.';
  }

  function setMode(next) {
    mode = next;
    orbit.enabled = (mode === 'orbit');
    document.getElementById('editBtn').classList.toggle('active', mode==='edit');
    document.getElementById('orbitBtn').classList.toggle('active', mode==='orbit');
    document.getElementById('status').textContent =
      mode === 'edit'
      ? 'Edit mode: drag white points; use Depth for front/behind.'
      : 'Orbit mode: rotate with one finger; pinch to zoom.';
  }

  function updateSelectionVisual() {
    controlsMeshes.forEach((m,i) => {
      m.material.color.set(i === selected ? 0xffd166 : 0xffffff);
      m.scale.setScalar(i === selected ? 1.35 : 1);
    });
  }

  function updateDepthUI() {
    const slider = document.getElementById('depth');
    const val = document.getElementById('depthValue');
    if (selected == null || !pts[selected]) {
      slider.disabled = true;
      val.textContent = '—';
    } else {
      slider.disabled = false;
      slider.value = pts[selected].z;
      val.textContent = Number(pts[selected].z).toFixed(2);
    }
  }

  function eventXY(e) {
    const t = e.touches && e.touches[0];
    return { x: t ? t.clientX : e.clientX, y: t ? t.clientY : e.clientY };
  }

  function setPointerFromEvent(e) {
    const p = eventXY(e);
    pointer.x = (p.x / innerWidth) * 2 - 1;
    pointer.y = -(p.y / innerHeight) * 2 + 1;
  }

  function pointerDown(e) {
    if (mode !== 'edit' || !showPoints) return;
    if (e.touches && e.touches.length > 1) return;
    setPointerFromEvent(e);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(controlsMeshes.filter(m=>m.visible), false);
    if (!hits.length) return;
    e.preventDefault();
    dragging = true;
    dragIndex = hits[0].object.userData.index;
    selected = dragIndex;
    updateSelectionVisual();
    updateDepthUI();

    camera.getWorldDirection(cameraDir);
    dragPlane.setFromNormalAndCoplanarPoint(cameraDir, pts[dragIndex]);
    document.getElementById('status').textContent =
      'Selected point ' + (dragIndex+1) + '. Drag it; Depth moves it front/back.';
  }

  function pointerMove(e) {
    if (!dragging || dragIndex < 0 || mode !== 'edit') return;
    e.preventDefault();
    setPointerFromEvent(e);
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
      // Keep current Z so the depth slider has an intuitive role.
      const oldZ = pts[dragIndex].z;
      pts[dragIndex].copy(intersection);
      pts[dragIndex].z = oldZ;
      updateAll();
    }
  }

  function pointerUp() {
    dragging = false;
    dragIndex = -1;
  }

  renderer.domElement.addEventListener('pointerdown', pointerDown, {passive:false});
  renderer.domElement.addEventListener('pointermove', pointerMove, {passive:false});
  renderer.domElement.addEventListener('pointerup', pointerUp);
  renderer.domElement.addEventListener('pointercancel', pointerUp);

  // Touch fallback for some iOS versions
  renderer.domElement.addEventListener('touchstart', pointerDown, {passive:false});
  renderer.domElement.addEventListener('touchmove', pointerMove, {passive:false});
  renderer.domElement.addEventListener('touchend', pointerUp, {passive:false});

  document.getElementById('depth').addEventListener('input', e => {
    if (selected == null) return;
    pts[selected].z = parseFloat(e.target.value);
    updateAll();
  });

  document.getElementById('editBtn').onclick = () => setMode('edit');
  document.getElementById('orbitBtn').onclick = () => setMode('orbit');

  document.getElementById('earthBtn').onclick = () => {
    const translucent = earthMat.opacity > .5;
    earthMat.opacity = translucent ? .22 : 1;
    wire.material.opacity = translucent ? .18 : .10;
    document.getElementById('earthBtn').textContent = translucent ? 'Earth ghost' : 'Earth solid';
  };

  document.getElementById('pointsBtn').onclick = () => {
    showPoints = !showPoints;
    setPointsVisibility();
    document.getElementById('pointsBtn').textContent = showPoints ? 'Points on' : 'Points off';
  };

  document.getElementById('resetBtn').onclick = reset;

  document.getElementById('addBtn').onclick = () => {
    if (selected == null) {
      selected = Math.max(0, pts.length-2);
    }
    const i = Math.min(selected+1, pts.length-1);
    const a = pts[Math.max(0,i-1)];
    const b = pts[Math.min(pts.length-1,i)];
    const p = a.clone().lerp(b,.5);
    pts.splice(i,0,p);
    selected = i;
    rebuildControls();
    rebuildSnake();
    updateDepthUI();
  };

  document.getElementById('deleteBtn').onclick = () => {
    if (selected == null || pts.length <= 6) return;
    pts.splice(selected,1);
    selected = Math.min(selected, pts.length-1);
    rebuildControls();
    rebuildSnake();
    updateDepthUI();
  };

  document.getElementById('shotBtn').onclick = () => {
    // Temporarily hide controls for a clean reference image.
    const prev = showPoints;
    showPoints = false;
    setPointsVisibility();
    renderer.render(scene,camera);
    const url = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ouroboros-pose.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    showPoints = prev;
    setPointsVisibility();
  };

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  reset();

  function animate() {
    requestAnimationFrame(animate);
    orbit.update();
    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>

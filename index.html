<!doctype html>

<meta charset="utf-8">
<!--
OUROBOROS POSE EDITOR — WORKING SPEC (v8)

Single-file, offline, touch-first HTML app for dev HTML Playground (dHP) on iPhone.
This file is an incremental extension of the supplied working baseline: preserve the canvas
renderer, continuous Catmull-Rom snake, point-zero HEAD / last-point TAIL semantics,
TAIL→HEAD arrows, Edit/Move/Pan separation, viewport-only pan/zoom, endpoint controls,
diagnostics, snapshots, JSON import/export, collapsible mobile UI, and iOS compatibility.

Scene depth is 0..14 with 6.5 as the normal reference and larger values closer to viewer.
Perspective Strength affects apparent illustration scale/thickness independently of viewport
zoom. Earth has x/y/depth/scale/lock state; Moon is Earth-relative and follows Earth.
Snake control points carry x/y/depth/manual-width/Earth-topology/contact metadata.
Explicit Earth and self-crossing topology overrides always beat automatic classification.

Input model:
- Tap/left-click a control point to select it; drag it in Edit mode to pose it.
- Move mode moves only the snake. Pan mode moves only the viewport.
- When Earth is unlocked, dragging Earth in Edit mode moves Earth (and therefore Moon).
- Long-press a snake segment to insert a control point at that curve location.
- Long-press a control point opens point actions; right-click opens the same contextual menu.
- Double-click a snake segment inserts a point. Existing Add/Delete buttons remain available.
- Two-finger pinch and two-finger translation zoom/pan the viewport simultaneously.
- Mouse wheel/trackpad zooms around the pointer; Shift+wheel pans; middle-drag or Space+drag pans.
- Keyboard: E/M/P modes, Cmd/Ctrl+Z undo, Cmd/Ctrl+Shift+Z redo, Delete/Backspace deletes an
  eligible point, +/- zooms, Escape closes transient UI. Shortcuts are suppressed in form fields.

All numeric slider controls expose minus/plus buttons and an editable numeric value. Typed
values clamp to the control range. Holding minus/plus repeats. One slider or held-button gesture
creates one undo step. Viewport pan/zoom is excluded from undo history.

Undo/redo stores compact meaningful scene snapshots (limit 50). Autosave uses localStorage and
restores on reload. JSON schema is version 8. Version-4 signed-depth JSON is migrated with
z -> clamp(z + 6.5, 0, 14); version-7 state is accepted with obsolete Length Lock and pixel-filter
fields ignored. Named checkpoints store pose snapshots but checkpoint creation/deletion does not
pollute pose undo history.

Topology: Earth occlusion is automatic with per-point AUTO/FRONT/BEHIND overrides. Self-crossing
analysis uses polyline segment intersections clustered by stable control-span pairs; manual crossing
front choices survive ordinary point motion and are remapped where practical across point insertion/
deletion. Diagnostic view can show transitions, crossing markers, contacts, gaze, depth and guides.

Additional editor features: Earth/Moon controls; snake outline; profile head rotation, neck width,
eye openness/position/gaze, mouth openness and diagnostic gaze arrow; tail direction/curvature;
manual body-width multipliers; contact markers/shadows; ouroboros reference circle, mouth-to-tail
guide and closure preview; one simple directional illustration light; clean/diagnostic modes;
current spline arc-length readout; clean/diagnostic snapshots; gesture-help sheet.

Removed by design: Length Lock/constraint solver and pixel-art post-processing. They proved harmful
or unhelpful to posing and are intentionally not part of schema v8.

Non-goals: no animation, WebGL, arbitrary 3D camera rotation, physics engine, skeletal rig,
real orbital simulation, axial Earth rotation, PBR, multiple lights, or ray tracing.
-->

body.ui-hidden #topbar,body.ui-hidden #sheet,body.ui-hidden #menu,body.ui-hidden #contextMenu{display:none!important}#restoreUI{position:fixed;z-index:30;display:none;right:max(10px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border-radius:22px;background:rgba(20,20,25,.78);color:#fff}body.ui-hidden #restoreUI{display:block}

<script>
(() => {
"use strict";

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rad=d=>d*Math.PI/180;
const canvas=$("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0,DPR=1,baseScale=1,cx=0,cy=0;
let viewX=0,viewY=0,viewZoom=1;
let selected=-1,mode="edit",snakeScale=1,perspectiveStrength=1,currentCrossing=0;
let showPoints=true,showLabels=true,showArrows=true,showXray=true,showNumbers=true,showTransitions=true,showContacts=true;
let diagnosticMode=true,cleanMode=false,spaceHeld=false;

const display={outline:true,outlineThickness:.08,referenceCircle:false,mouthTailGuide:false,closurePreview:false,gazeArrow:true};
const endpoint={headSize:1,headRotation:0,neckWidth:1,eyeOpen:.35,eyeX:.22,eyeY:-.18,gazeDirection:-70,mouthOpen:.18,tailLength:1,tailWidth:1,tailDirection:0,tailCurvature:0};
const earth={x:0,y:0,r:2.15,depth:6.5,scale:1,alpha:1,locked:true};
const moon={visible:true,angle:35,radius:3,size:.27,relativeDepth:1};
const lighting={enabled:true,direction:-45,intensity:.65,softness:.6,shadows:true};
let crossingOverrides={};
const checkpoints={};
const history={undo:[],redo:[],limit:50};

const oldClosedPose=[[-.55,2.35,.8],[-1.45,2.18,.4],[-2.35,1.60,0],[-2.85,.65,-.3],[-2.90,-.55,.3],[-2.35,-1.65,1.5],[-1.25,-2.35,3.2],[.05,-2.58,4.2],[1.35,-2.30,3.3],[2.35,-1.55,1.5],[2.82,-.45,0],[2.70,.75,-1],[2.15,1.65,-2.2],[1.20,2.20,-2.8],[-.30,2.37,-1.5]];
const migrateDepth=z=>clamp((+z||0)+6.5,0,14);
const makePoint=p=>({x:+p[0],y:+p[1],z:migrateDepth(p[2]),width:1,earth:"AUTO",contact:"AUTO"});
const closedPose=oldClosedPose.map(makePoint);
let pts=closedPose.map(p=>({...p}));

function clone(v){return JSON.parse(JSON.stringify(v));}
function sceneState(){return{pts:clone(pts),selected,snakeScale,perspectiveStrength,endpoint:clone(endpoint),earth:clone(earth),moon:clone(moon),lighting:clone(lighting),crossingOverrides:clone(crossingOverrides),display:clone(display),flags:{showPoints,showLabels,showArrows,showXray,showNumbers,showTransitions,showContacts,diagnosticMode,cleanMode}};}
function sameScene(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function applyScene(s){pts=clone(s.pts||pts);selected=Number.isInteger(s.selected)?clamp(s.selected,-1,pts.length-1):-1;snakeScale=+(s.snakeScale??1);perspectiveStrength=+(s.perspectiveStrength??1);Object.assign(endpoint,s.endpoint||{});Object.assign(earth,s.earth||{});Object.assign(moon,s.moon||{});Object.assign(lighting,s.lighting||{});crossingOverrides=clone(s.crossingOverrides||{});Object.assign(display,s.display||{});if(s.flags){showPoints=s.flags.showPoints??showPoints;showLabels=s.flags.showLabels??showLabels;showArrows=s.flags.showArrows??showArrows;showXray=s.flags.showXray??showXray;showNumbers=s.flags.showNumbers??showNumbers;showTransitions=s.flags.showTransitions??showTransitions;showContacts=s.flags.showContacts??showContacts;diagnosticMode=s.flags.diagnosticMode??diagnosticMode;cleanMode=s.flags.cleanMode??cleanMode;}syncAllUI();draw();autosave();}
function commit(before){const after=sceneState();if(before&&!sameScene(before,after)){history.undo.push(before);if(history.undo.length>history.limit)history.undo.shift();history.redo.length=0;syncHistory();autosave();}}
function mutate(fn){const before=sceneState();fn();commit(before);syncAllUI();draw();}
function undo(){if(!history.undo.length)return;const cur=sceneState(),prev=history.undo.pop();history.redo.push(cur);applyScene(prev);syncHistory();}
function redo(){if(!history.redo.length)return;const cur=sceneState(),next=history.redo.pop();history.undo.push(cur);applyScene(next);syncHistory();}
function syncHistory(){$("undoBtn").disabled=!history.undo.length;$("redoBtn").disabled=!history.redo.length;}

let autosaveTimer=0;
function autosave(){try{localStorage.setItem("ouroborosPoseEditor.autosave.v8",JSON.stringify(exportState(true)));localStorage.setItem("ouroborosPoseEditor.schema","8");}catch(e){}}
function scheduleAutosave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(autosave,220);}
function restoreAutosave(){try{const raw=localStorage.getItem("ouroborosPoseEditor.autosave.v8")||localStorage.getItem("ouroborosPoseEditor.autosave.v7");if(raw)importData(JSON.parse(raw),true);}catch(e){}}

canvas.addEventListener("dblclick",e=>{if(mode!=="edit")return;if(nearestPoint(e.clientX,e.clientY)>=0)return;const loc=nearestCurveLocation(e.clientX,e.clientY);if(loc)mutate(()=>insertPointAtLocation(loc));});
canvas.addEventListener("wheel",e=>{e.preventDefault();closeContextMenu();if(e.shiftKey){viewX-=e.deltaX||0;viewY-=e.deltaY||0;draw();scheduleAutosave();return;}const factor=Math.exp(-e.deltaY*.0015);zoomAt(e.clientX,e.clientY,viewZoom*factor);},{passive:false});

function formFocused(){const a=document.activeElement;return !!a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"||a.isContentEditable);}
addEventListener("keydown",e=>{if(formFocused())return;const key=e.key.toLowerCase(),mod=e.metaKey||e.ctrlKey;if(mod&&key==="z"){e.preventDefault();if(e.shiftKey)redo();else undo();return;}if(e.key===" "){spaceHeld=true;e.preventDefault();return;}if(key==="e"){setMode("edit");return;}if(key==="m"){setMode("move");return;}if(key==="p"){setMode("pan");return;}if(e.key==="Delete"||e.key==="Backspace"){if(selected>0&&selected<pts.length-1&&pts.length>7){e.preventDefault();mutate(deleteSelectedPoint);}return;}if(e.key==="+"||e.key==="="){e.preventDefault();zoomAt(W/2,H/2,viewZoom*1.12);return;}if(e.key==="-"||e.key==="_"){e.preventDefault();zoomAt(W/2,H/2,viewZoom/1.12);return;}if(e.key==="Escape"){closeContextMenu();$("menu").classList.remove("open");$("overlay").style.display="none";}});
addEventListener("keyup",e=>{if(e.key===" ")spaceHeld=false;});

function exportState(includeCheckpoints=true){return{version:8,coordinateSystem:{depthMinimum:0,depthNormal:6.5,depthMaximum:14,direction:"tail-to-head"},perspectiveStrength,earth:clone(earth),moon:clone(moon),snake:{scale:snakeScale,points:clone(pts),head:clone(endpoint)},topology:{crossingOverrides:clone(crossingOverrides)},lighting:clone(lighting),view:{x:viewX,y:viewY,zoom:viewZoom},display:{outline:display.outline,outlineThickness:display.outlineThickness,referenceCircle:display.referenceCircle,mouthTailGuide:display.mouthTailGuide,closurePreview:display.closurePreview,gazeArrow:display.gazeArrow,arrows:showArrows,points:showPoints,depthLabels:showLabels,xray:showXray,numbers:showNumbers,transitions:showTransitions,contacts:showContacts,diagnosticMode,cleanMode},checkpoints:includeCheckpoints?clone(checkpoints):{}};}
function importData(data,silent=false){if(data.version===4&&data.snake?.head){pts=[data.snake.head.point,...(data.snake.body||[]),data.snake.tail.point].map(makePoint);snakeScale=+(data.snake.scale??1);endpoint.headSize=+(data.snake.head.size??1);endpoint.tailLength=+(data.snake.tail.length??1);endpoint.tailWidth=+(data.snake.tail.width??1);if(data.earth){earth.x=+(data.earth.x??0);earth.y=+(data.earth.y??0);earth.r=+(data.earth.radius??2.15);}if(data.view){viewX=+(data.view.x??0);viewY=+(data.view.y??0);viewZoom=+(data.view.zoom??1);}}else{const rawPts=data.snake?.points||data.pts;if(rawPts)pts=rawPts.map(p=>Array.isArray(p)?makePoint([p[0],p[1],(+p[2]||6.5)-6.5]):{x:+p.x,y:+p.y,z:clamp(+p.z,0,14),width:+(p.width??1),earth:p.earth||"AUTO",contact:p.contact||"AUTO"});snakeScale=+(data.snake?.scale??data.snakeScale??1);perspectiveStrength=+(data.perspectiveStrength??1);Object.assign(endpoint,data.snake?.head||data.endpoint||{});Object.assign(earth,data.earth||{});Object.assign(moon,data.moon||{});Object.assign(lighting,data.lighting||{});crossingOverrides=clone(data.topology?.crossingOverrides||data.crossingOverrides||{});if(data.display){for(const key of["outline","outlineThickness","referenceCircle","mouthTailGuide","closurePreview","gazeArrow"])if(key in data.display)display[key]=data.display[key];showArrows=data.display.arrows??showArrows;showPoints=data.display.points??showPoints;showLabels=data.display.depthLabels??showLabels;showXray=data.display.xray??showXray;showNumbers=data.display.numbers??showNumbers;showTransitions=data.display.transitions??showTransitions;showContacts=data.display.contacts??showContacts;diagnosticMode=data.display.diagnosticMode??diagnosticMode;cleanMode=data.display.cleanMode??cleanMode;}if(data.view){viewX=+(data.view.x??0);viewY=+(data.view.y??0);viewZoom=clamp(+(data.view.zoom??1),.35,4);}if(data.checkpoints){for(const k of Object.keys(checkpoints))delete checkpoints[k];Object.assign(checkpoints,clone(data.checkpoints));}}
selected=-1;if(!silent){syncAllUI();draw();autosave();}}

function openJSON(kind){$("overlay").style.display="flex";$("snapshotImage").style.display="none";$("checkpointBox").style.display="none";$("jsonBox").style.display="block";$("overlayTitle").textContent=kind==="import"?"Paste pose JSON":"Exported pose JSON";$("jsonBox").value=kind==="import"?"":JSON.stringify(exportState(),null,2);$("applyImport").style.display=kind==="import"?"block":"none";$("copyOverlay").style.display="block";}
$("export").onclick=()=>openJSON("export");$("import").onclick=()=>openJSON("import");$("copyOverlay").onclick=async()=>{try{await navigator.clipboard.writeText($("jsonBox").value);}catch(err){$("jsonBox").focus();$("jsonBox").select();document.execCommand("copy");}};$("applyImport").onclick=()=>{try{const before=sceneState();importData(JSON.parse($("jsonBox").value));commit(before);$("overlay").style.display="none";}catch(err){alert("Could not import that JSON.");}};
function snapshot(kind){const old={cleanMode,diagnosticMode,showPoints,showLabels};if(kind==="clean"){cleanMode=true;diagnosticMode=false;showPoints=false;showLabels=false;}else if(kind==="diagnostic"){cleanMode=false;diagnosticMode=true;showPoints=true;showLabels=true;}else{showPoints=false;showLabels=false;}draw();const image=canvas.toDataURL("image/png");({cleanMode,diagnosticMode,showPoints,showLabels}=old);draw();$("overlay").style.display="flex";$("overlayTitle").textContent=kind==="clean"?"Clean Snapshot":kind==="diagnostic"?"Diagnostic Snapshot":"Snapshot";$("snapshotImage").src=image;$("snapshotImage").style.display="block";$("jsonBox").style.display="none";$("checkpointBox").style.display="none";$("copyOverlay").style.display="none";$("applyImport").style.display="none";}
$("snapshot").onclick=()=>snapshot("normal");$("cleanSnapshot").onclick=()=>snapshot("clean");$("diagSnapshot").onclick=()=>snapshot("diagnostic");
function saveCheckpoint(){const name=prompt("Checkpoint name","final");if(!name)return;checkpoints[name]=sceneState();autosave();}$("saveCheckpoint").onclick=saveCheckpoint;
function showCheckpoints(){$("overlay").style.display="flex";$("overlayTitle").textContent="Checkpoints";$("snapshotImage").style.display="none";$("jsonBox").style.display="none";$("checkpointBox").style.display="block";$("copyOverlay").style.display="none";$("applyImport").style.display="none";const box=$("checkpointBox");box.className="";box.innerHTML="";const names=Object.keys(checkpoints);if(!names.length){box.textContent="No checkpoints saved.";return;}for(const name of names){const row=document.createElement("div");row.className="checkpointRow";const label=document.createElement("span");label.textContent=name;const load=document.createElement("button");load.textContent="Load";load.onclick=()=>{const before=sceneState();applyScene(checkpoints[name]);commit(before);$("overlay").style.display="none";};const del=document.createElement("button");del.textContent="Delete";del.onclick=()=>{delete checkpoints[name];autosave();showCheckpoints();};row.append(label,load,del);box.appendChild(row);}}
$("checkpointMenu").onclick=showCheckpoints;
function showGestureHelp(){$("overlay").style.display="flex";$("overlayTitle").textContent="Controls & gestures";$("snapshotImage").style.display="none";$("jsonBox").style.display="none";$("checkpointBox").style.display="block";$("copyOverlay").style.display="none";$("applyImport").style.display="none";const box=$("checkpointBox");box.className="helpText";box.innerHTML=`<p><b>Edit:</b> tap/click a point to select; drag it to pose. Long-press a snake segment or double-click it to add a point. Long-press/right-click a point for point actions.</p><p><b>Move:</b> drag to move only the snake. <b>Pan:</b> drag to move only the viewport. When Earth is unlocked, drag Earth in Edit mode to move Earth and Moon.</p><p><b>Touch:</b> two fingers pan and pinch-zoom at the same time. <b>Mouse/trackpad:</b> wheel zooms around the pointer; Shift+wheel pans; middle-drag or Space+drag temporarily pans.</p><p><b>Keyboard:</b> E Edit, M Move, P Pan, Cmd/Ctrl+Z Undo, Cmd/Ctrl+Shift+Z Redo, Delete/Backspace removes an eligible body point, +/- zoom, Esc closes menus.</p><p><b>Numbers:</b> every slider has − / + and an exact-value field. Hold − or + to repeat.</p>`;}
$("gestureHelp").onclick=showGestureHelp;$("closeOverlay").onclick=()=>$("overlay").style.display="none";

addEventListener("resize",resize);
enhanceNumericControls();
restoreAutosave();
syncAllUI();
resize();
})();

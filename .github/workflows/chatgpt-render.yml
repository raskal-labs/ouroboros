name: ChatGPT renderer transformation

on:
  push:
    branches:
      - chatgpt-v1-task12
    paths:
      - .github/workflows/chatgpt-render.yml

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-v1-task12
          fetch-depth: 0
      - name: Transform renderer
        run: python scripts/chatgpt_render_transform.py
      - name: Validate JavaScript
        run: node --check js/app.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-render.yml scripts/chatgpt_render_transform.py
          git add js/app.js
          git commit -m "fix visual bite anchors and add PS1 renderer"
          git push origin HEAD:chatgpt-v1-task12
